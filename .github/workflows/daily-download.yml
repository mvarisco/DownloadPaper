name: Download quotidiano e upload su Drive

# Nessuno "schedule" qui: su questo repo il cron di GitHub Actions non
# partiva in modo affidabile. Lo scheduling reale e' esterno: un crontab su
# una VM Linux (vedi SETUP.md) invoca questo workflow ogni 10 minuti con
# `gh workflow run`, che genera un evento workflow_dispatch.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  # Serve in lettura per poter leggere la cronologia delle run precedenti di
  # questo stesso workflow (step "Calcola fallimenti consecutivi pregressi").
  actions: read

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcola fallimenti consecutivi pregressi
        id: prior-failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Lo script viene invocato ogni 10 minuti da un crontab esterno: ogni
          # esecuzione e' un runner nuovo ed effimero, quindi per sapere "quante
          # volte di fila ha fallito" si legge la cronologia delle run passate
          # di questa stessa Action (si ferma al primo esito diverso da
          # "failure"), invece di tenere uno stato esterno.
          conclusions=$(gh run list --workflow "daily-download.yml" --status completed --limit 20 --json conclusion --jq '.[].conclusion')
          count=0
          while IFS= read -r conclusion; do
            if [ "$conclusion" = "failure" ]; then
              count=$((count + 1))
            else
              break
            fi
          done <<< "$conclusions"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        working-directory: job
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Esegui il job
        working-directory: job
        env:
          IFQ_USERNAME: ${{ secrets.IFQ_USERNAME }}
          IFQ_PASSWORD: ${{ secrets.IFQ_PASSWORD }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          PRIOR_CONSECUTIVE_FAILURES: ${{ steps.prior-failures.outputs.count }}
        run: python main.py

      - name: Carica diagnostica in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-failure
          path: |
            job/debug_failure_screenshot.png
            job/debug_failure_page.html
          if-no-files-found: ignore
          retention-days: 5
